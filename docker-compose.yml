version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nyayavault
      POSTGRES_PASSWORD: nyayapassword
      POSTGRES_DB: nyayavault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
